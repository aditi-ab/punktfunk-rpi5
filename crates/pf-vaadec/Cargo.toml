[package]
name = "pf-vaadec"
description = "Native VAAPI H.264/HEVC/AV1 decode for the Linux clients (M6, M7): the hand-declared libva decode buffer layouts plus the profile/format/surface decisions — the CPU-testable half; the libva plumbing lives in pf-client-core (design/client-native-decode.md §3.4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Direct dependency on the vendored parser crate, not just pf-bitstream: the conversion
# consumes the parser's `Sps`/`Pps`/`SliceType` wholesale (pf-bitstream re-exports only a
# subset), and the same path means the one crate instance the workspace already builds.
cros-codecs = { path = "../pf-bitstream/vendor/cros-codecs" }
pf-bitstream = { path = "../pf-bitstream" }
# For `SlotMap`/`SlotError` ONLY — see this crate's lib.rs for why the DPB slot ledger is
# borrowed from the Vulkan crate rather than duplicated or moved.
pf-vkdecode = { path = "../pf-vkdecode" }

[lints]
workspace = true
