# The one process-lifetime tokio runtime every xdg-desktop-portal call runs on, in a leaf so the
# libei injector (pf-inject) shares it with capture and the virtual displays without compiling
# the PipeWire capture stack. Content is Linux-only; the crate compiles to an empty lib elsewhere.
[package]
name = "pf-portal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "punktfunk host: the never-dropped tokio runtime every xdg-desktop-portal call runs on."
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
# `enable_all` turns on the IO and time drivers the zbus reader and the handshake timeouts need.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time"] }

[lints]
workspace = true
