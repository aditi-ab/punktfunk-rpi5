# Smoke test for the guided installer. Runs it unattended inside a clean container per package
# family against the REAL package registry — the one path a textual gate can't cover: does the
# repo line, the key import and the install actually work today on a fresh box. `--no-start`
# because a container has no user systemd; it degrades to printing the enable command, which is
# also under test.
#
# TWO installers are under test until WP4.3 (design/installer-v2.md): `entry: sh` is today's
# shipped scripts/install.sh, `entry: binary` is crates/punktfunk-setup built FROM THIS TREE —
# never the published binary, which only the M4 probe job touches. The matrix doubling is
# deliberate and temporary; the sh entry retires with the script body.
#
# Path-filtered on purpose: it pulls ~100 MB of packages per family, so it runs when an installer
# or its fact source changes, not on every push (ci.yml runs the cheap halves — the goldens and
# the sh-vs-binary parity check — on every push).
name: installer-smoke
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - scripts/install.sh
      - data/platforms.json
      - scripts/ci/check-install-defaults.sh
      - crates/punktfunk-setup/**
      - packaging/linux/omarchy/punktfunk-omarchy
      - packaging/linux/omarchy/selftest.sh
      - .gitea/workflows/installer-smoke.yml
  pull_request:
    paths:
      - scripts/install.sh
      - data/platforms.json
      - scripts/ci/check-install-defaults.sh
      - crates/punktfunk-setup/**
      - packaging/linux/omarchy/punktfunk-omarchy
      - packaging/linux/omarchy/selftest.sh
      - .gitea/workflows/installer-smoke.yml

jobs:
  # One static binary the family containers can all run, built from the PR's tree. musl needs no
  # C cross-toolchain here: the crate is pure Rust, so rust-lld plus the target's self-contained
  # crt objects link it (measured: 984 KB static-pie, seconds to build).
  setup-binary:
    name: build punktfunk-setup (musl)
    runs-on: ubuntu-24.04
    container:
      image: 192.168.1.58:5010/punktfunk-rust-ci:latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: -C linker=rust-lld -C link-self-contained=yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the static installer from this tree
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked -p punktfunk-setup \
            --target x86_64-unknown-linux-musl
      - name: It is actually static
        run: |
          file target/x86_64-unknown-linux-musl/release/punktfunk-setup | grep -q 'static-pie'
      # v3: Gitea's API rejects upload-artifact@v4 (see apple.yml). Download is a zip.
      - uses: actions/upload-artifact@v3
        with:
          name: punktfunk-setup-musl
          path: target/x86_64-unknown-linux-musl/release/punktfunk-setup

  defaults:
    name: derived defaults
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert per-family installer defaults
        run: sh scripts/ci/check-install-defaults.sh

  omarchy:
    name: omarchy integration self-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `punktfunk-omarchy` only ever runs on an Omarchy box, so nothing else can exercise the
      # parts of it that edit a file the user owns — or that simply have to REACH the end under
      # `set -euo pipefail`. It needs no container: bash and python3 are all the checks use.
      - name: Run the Omarchy integration self-check
        run: bash packaging/linux/omarchy/selftest.sh

  smoke:
    name: smoke (${{ matrix.family }}, ${{ matrix.entry }})
    runs-on: ubuntu-24.04
    needs: setup-binary
    timeout-minutes: 25
    env:
      # The one installer this leg drives. Both take the same flags — that is the D5
      # compatibility contract, and running the identical scenario steps is what proves it.
      PF: ${{ matrix.entry == 'binary' && '/usr/local/bin/punktfunk-setup' || 'sh scripts/install.sh' }}
    strategy:
      fail-fast: false
      matrix:
        family: [debian-13, fedora-44, arch]
        entry: [sh, binary]
        include:
          # actions/checkout needs git + node + CA certs in the container; curl is the
          # script's own prerequisite (it says so and stops without it).
          - family: debian-13
            image: debian:trixie
            prep: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl git nodejs
            rmweb: apt-get purge -y punktfunk-web
            oncanary: grep -q ' canary main' /etc/apt/sources.list.d/punktfunk.list
            onstable: grep -q ' stable main' /etc/apt/sources.list.d/punktfunk.list
          - family: fedora-44
            image: fedora:44
            prep: dnf install -y -q curl git nodejs
            rmweb: dnf remove -y punktfunk-web
            oncanary: grep -q 'fedora-44-canary' /etc/yum.repos.d/punktfunk.repo
            onstable: grep -q 'rpm/fedora-44$' /etc/yum.repos.d/punktfunk.repo
          - family: arch
            image: archlinux:base
            prep: pacman -Sy --noconfirm --needed curl git nodejs && (pacman-key --init >/dev/null 2>&1 || true)
            rmweb: pacman -Rns --noconfirm punktfunk-web
            oncanary: grep -q '^\[punktfunk-canary\]' /etc/pacman.conf && ! grep -q '^\[punktfunk\]' /etc/pacman.conf
            onstable: grep -q '^\[punktfunk\]' /etc/pacman.conf && ! grep -q '^\[punktfunk-canary\]' /etc/pacman.conf
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Prepare the container (${{ matrix.family }})
        run: ${{ matrix.prep }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the installer binary built from this tree
        if: matrix.entry == 'binary'
        uses: actions/download-artifact@v3
        with:
          name: punktfunk-setup-musl
          path: /usr/local/bin
      - name: Make it executable
        if: matrix.entry == 'binary'
        run: chmod +x /usr/local/bin/punktfunk-setup
      # No tty → the installer runs as --yes; --no-start because there is no user systemd here.
      # Root without sudo → the sudo shim, another path under test.
      - name: Run the installer unattended
        run: $PF --yes --no-start
      - name: The host is installed and conflict-free
        run: |
          punktfunk-host --version
          punktfunk-host detect-conflicts
      # The console is the whole management surface — pairing, approving a device, every setting.
      # A host without it can be installed and still be useless, so assert it by name: the binary
      # the package puts on PATH and the user unit step 6 enables.
      - name: The web console is installed too
        run: |
          command -v punktfunk-web-server
          test -f /usr/lib/systemd/user/punktfunk-web.service
      - name: Re-running is a no-op install
        run: $PF --yes --no-start | grep -q 'already installed'
      # The reported Fedora failure, as a test: a box that has the host but lost (or never got)
      # the console must get one back from a re-run. Before the per-package check, the installer
      # saw punktfunk-host on PATH, declared itself done, and left the box without a console
      # while still printing the console's URL.
      - name: A host without a console gets one back on re-run
        run: |
          ${{ matrix.rmweb }}
          ! command -v punktfunk-web-server
          $PF --yes --no-start
          command -v punktfunk-web-server
      # The channel switch, both ways, against the real registries — the half no textual gate can
      # reach. Two things are actually at risk here and nowhere else: that the canary repo resolves
      # at all, and that the walk back DOWN to stable happens instead of silently no-opping (canary
      # is always a minor ahead, so every package manager refuses that step without being told).
      # The version moving and then coming back is the proof; the repo-config greps localise a
      # failure to the rewrite half. A red here can also mean the family's canary channel is empty
      # — check https://git.unom.io/unom/-/packages before hunting in the script.
      - name: Switch to canary and back to stable
        run: |
          set -eu
          stable_v=$(punktfunk-host --version | head -1)
          $PF --yes --no-start --channel canary
          ${{ matrix.oncanary }}
          canary_v=$(punktfunk-host --version | head -1)
          test "$canary_v" != "$stable_v" \
            || { echo "switch to canary left the version at $stable_v"; exit 1; }
          command -v punktfunk-web-server
          $PF --yes --no-start --channel stable
          ${{ matrix.onstable }}
          back_v=$(punktfunk-host --version | head -1)
          test "$back_v" = "$stable_v" \
            || { echo "walk back to stable gave $back_v, not $stable_v (a downgrade that did not happen?)"; exit 1; }
      # A re-run with no --channel must follow the box, not the flag's stable default.
      - name: A bare re-run does not drag a canary box back to stable
        run: |
          set -eu
          $PF --yes --no-start --channel canary
          canary_v=$(punktfunk-host --version | head -1)
          $PF --yes --no-start
          ${{ matrix.oncanary }}
          test "$(punktfunk-host --version | head -1)" = "$canary_v" \
            || { echo "a bare re-run moved a canary box off $canary_v"; exit 1; }
          $PF --yes --no-start --channel stable
      - name: --uninstall takes the packages and the repo off again
        run: |
          $PF --yes --uninstall
          ! command -v punktfunk-host
          ! test -e /etc/apt/sources.list.d/punktfunk.list -o -e /etc/yum.repos.d/punktfunk.repo
          ! grep -q '^\[punktfunk\]' /etc/pacman.conf 2>/dev/null
