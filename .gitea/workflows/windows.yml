# Windows client CI — runs on the self-hosted Windows runner (home-windows-1, host mode; see
# scripts/ci/setup-windows-runner.ps1). Build + clippy + fmt + test the WinUI 3 client
# (windows-reactor + D3D11/SwapChainPanel + WASAPI + SDL3) on x86_64-pc-windows-msvc.
#
# The MSVC/WinUI/FFmpeg toolchain (cargo/rustup on ASCII paths, NASM, CMake, LLVM, FFmpeg,
# CARGO_HOME, CMAKE_POLICY_VERSION_MINIMUM, …) is baked into the runner's daemon env, so jobs
# inherit it. The one per-checkout var is CARGO_WORKSPACE_DIR — windows-reactor's build.rs
# unwraps it and stages the Windows App SDK NuGets + winmd under it.
name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-amd64
    timeout-minutes: 60
    env:
      # windows-reactor's build.rs `.unwrap()`s this and writes /temp + /winmd under it.
      CARGO_WORKSPACE_DIR: ${{ github.workspace }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain + workspace path
        run: |
          rustc --version
          cargo --version
          node --version
          Write-Output "workspace: $env:GITHUB_WORKSPACE"

      - name: Build
        run: cargo build -p punktfunk-client-windows

      - name: Clippy (-D warnings)
        run: cargo clippy -p punktfunk-client-windows --all-targets -- -D warnings

      - name: Rustfmt check
        run: cargo fmt -p punktfunk-client-windows -- --check

      - name: Test
        run: cargo test -p punktfunk-client-windows
